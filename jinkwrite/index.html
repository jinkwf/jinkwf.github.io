<style>
:root{--bg:#F3F1F6;--card:#fff;--ink:#1F1B2E;--muted:#6B6680;--line:#DAD6E3;--ph:#E7E3EE;--gs:"Gungsuh","GungsuhChe","궁서","궁서체","Noto Serif KR",serif}
@media (prefers-color-scheme:dark){:root{--bg:#1A1725;--card:#25212F;--ink:#EEEAF6;--muted:#9C97AE;--line:#3A3547;--ph:#302B3D}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.7 "Noto Sans KR",system-ui,sans-serif;padding:0 20px 80px}
.wrap{max-width:1040px;margin:0 auto}
header{padding:64px 0 24px}
h1{font:900 clamp(40px,8vw,72px)/1.1 "Noto Serif KR",serif;letter-spacing:-.02em}
.sub{margin-top:12px;color:var(--muted)}
.notice{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;max-width:640px}
.notice h2{font:700 15px "Noto Sans KR",sans-serif;letter-spacing:.08em;margin-bottom:10px}
.notice p{margin-bottom:12px;font-size:14px}
.notice p:last-child{margin-bottom:0}
.notice a{color:var(--ink);text-underline-offset:3px}
.notice .lab{display:block;color:var(--muted);font-size:13px}
.notice .gs{font-family:var(--gs);font-size:19px;line-height:1.7;letter-spacing:.02em}
.btn{display:inline-block;margin-top:16px;padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500}
.btn:hover{opacity:.85}
:focus-visible{outline:3px solid #7B5CFF;outline-offset:2px}
details{margin-top:14px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px}
summary{cursor:pointer;list-style:none;padding:14px 18px;font:700 17px/1.4 "Noto Serif KR",serif;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
.tag{font:500 13px "Noto Sans KR",sans-serif;color:var(--c)}
.inner{padding:0 18px 18px}
.row+.row{margin-top:18px}
.rowhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rowhead h3{font:400 18px var(--gs)}
.rowhead .note{color:var(--muted);font-size:12px}
.arrows{margin-left:auto;display:flex;gap:6px}
.arrows button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:15px}
.slider{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.card{flex:none;width:170px;scroll-snap-align:start;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.img{position:relative;aspect-ratio:3/4;background:var(--ph);display:grid;place-items:center;font:900 44px "Noto Serif KR",serif;color:var(--c)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font:500 11px/1 "Noto Sans KR",sans-serif;padding:4px 7px;border-radius:999px;background:var(--ink);color:var(--bg)}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.body b{font-size:14px;line-height:1.4}
.body span{font-size:12px;color:var(--muted)}
.soon .card{border-style:dashed;cursor:default}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;margin:auto}
dialog::backdrop{background:rgba(20,16,32,.6)}
.pop .img{font-size:96px;border-radius:0}
.pop h2{font:700 22px/1.4 "Noto Serif KR",serif;padding:16px 20px 22px}
.pop .badges{top:12px;left:12px}
.pop .badge{font-size:12px;padding:5px 9px}
.close{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px;cursor:pointer}
.pop{position:relative}
footer{margin-top:56px;color:var(--muted);font-size:13px}
@media(max-width:520px){.card{width:140px}.arrows{display:none}}
</style>

const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const plain=s=>s.replace(/^[^\wㄱ-힣]+/u,"");

function imgBox(name,img,tags){
  const im=$("div","img");
  if(img){const i=$("img");i.src=img;i.alt=name;i.loading="lazy";im.appendChild(i)}
  else im.textContent="?";
  if(tags&&tags.length){const b=$("div","badges");tags.forEach(t=>b.appendChild($("span","badge",t)));im.appendChild(b)}
  return im;
}

/* 팝업 — 지금은 이미지 + 이름만. 상세내용은 나중에 여기에 추가 */
const dlg=document.getElementById("dlg"),pop=document.getElementById("pop");
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
function openPop(item){
  const [name,,,img,o={}]=item;
  const x=$("button","close","✕");x.type="button";x.setAttribute("aria-label","닫기");x.onclick=()=>dlg.close();
  pop.replaceChildren(x,imgBox(name,img,o.tags),$("h2",null,name));
  pop.style.setProperty("--c",pop.dataset.c||"#7B5CFF");
  dlg.showModal();
}

function card(item,cat,from){
  const [name,,,img,o={}]=item;
  const c=$("button","card");c.type="button";
  c.appendChild(imgBox(name,img,o.tags));
  const b=$("div","body");b.appendChild($("b",null,name));
  if(from)b.appendChild($("span",null,from));
  c.appendChild(b);
  if(!cat.soon)c.onclick=()=>{pop.dataset.c=cat.color;openPop(item)};
  return c;
}

/* NEW — added 날짜가 있는 작품을 최신순으로 자동 수집 */
const fresh=[];
CATS.forEach(cat=>cat.rows.forEach(r=>r.items.forEach(it=>{
  if(it[4]&&it[4].added)fresh.push({it,cat:{...cat,soon:false},from:plain(cat.name)});
})));
fresh.sort((a,b)=>b.it[4].added.localeCompare(a.it[4].added));
const NEW={isNew:true,name:"NEW",color:"#E5484D",rows:[{items:fresh.slice(0,NEW_MAX)}]};

const main=document.getElementById("main");
[NEW,...CATS].forEach((cat,i)=>{
  const d=$("details",cat.soon?"soon":"");d.style.setProperty("--c",cat.color);
  const s=$("summary");
  if(cat.isNew)s.append($("span",null,"NEW"),$("span","tag","최근 추가순"));
  else s.append($("span",null,cat.soon?"SOON":i+"."),$("span","tag",cat.tag&&!cat.soon?"["+cat.tag+"]":""),$("span",null,cat.name));
  d.appendChild(s);
  const inner=$("div","inner");
  cat.rows.forEach(r=>{
    const row=$("div","row"),head=$("div","rowhead");
    if(r.t)head.appendChild($("h3",null,r.t));
    if(r.note)head.appendChild($("span","note",r.note));
    const sl=$("div","slider");
    r.items.forEach(it=>sl.appendChild(cat.isNew?card(it.it,it.cat,it.from):card(it,cat)));
    const ar=$("div","arrows");
    [["‹",-1],["›",1]].forEach(([t,dir])=>{
      const b=$("button",null,t);b.type="button";b.setAttribute("aria-label",dir<0?"이전":"다음");
      b.onclick=()=>sl.scrollBy({left:dir*360,behavior:"smooth"});ar.appendChild(b);
    });
    head.appendChild(ar);
    row.append(head,sl);inner.appendChild(row);
  });
  d.appendChild(inner);main.appendChild(d);
});
