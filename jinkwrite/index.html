/* 작품별 활동 플랫폼. 작품 이름이 같으면 자동으로 태그가 붙어요. 여기만 고치면 태그가 바뀝니다 */
const TP="티팟";
const PFMAP={
"세가지":[WH,TG,DM,PO],"심성훈":[WH,TG,PO],"X":[WH,TG],"단임":[WH,TG],"정윤조":[WH,TG],
"강도훈":[WH,TG,PO,IC,DM,TP],"NSI 제 7과":[WH,TG,IC],"강아지":A5,"하연수":[WH,TG,DM,IC],"연우주":[WH,TG],
"권주석":[WH,TG,DM,IC],"윤태우":[WH,TG,IC],"서도훈":[WH,TG,DM,IC],"무서욱":A5,"임서준":[WH,TG],"로즈쿼츠 6인의 호스트":[WH,TG,DM,IC],
"박하인":[WH,TG],"Afor":[WH,TG],"유태석":[WH,TG,DM],
"드래곤 육아는 처음이라서요":[WH,TG,DM,IC],"루시엘 발렌티누스 요한 12세":[WH,TG],"리엘 테라시아":[WH,TG,DM,IC],
"차설하":[WH,TG],"수현오":[WH,TG],
"Pointer":[WH,TG],"nightmare":[WH,TG,DM,IC],"레온하르트":[WH,TG],"AER-100":[WH,TG],"비행일지":[WH,TG,DM,IC],
"차선태":[WH,TG],"자판기":[WH,TG],"나비인간":[DM],
"아사히나 소우":[WH,TG],"니코":[WH],"올리버 밀러":[WH,TG],"백연하":[TG,IC]
};
CATS.forEach(c=>c.rows.forEach(r=>r.items.forEach(it=>{if(PFMAP[it[0]])it[4].pf=PFMAP[it[0]]})));

const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const plain=s=>s.replace(/^[^\wㄱ-힣]+/u,"");

/* 상단 세계관 천체도: 카테고리 하나 = 별 하나, 바깥 링의 이름은 천천히 돕니다(마우스를 올리면 멈춤) */
const L=CATS.map((c,j)=>[c,j]).filter(([c])=>!c.soon),n=L.length;
const pts=L.map((_,i)=>{const a=i/n*Math.PI*2-Math.PI/2,r=62+48*(.5+.5*Math.sin(i*2.3));return [(200+r*Math.cos(a)).toFixed(1),(200+r*Math.sin(a)).toFixed(1)]});
const map=document.getElementById("map"),cap=document.getElementById("cap");let CAP0="";
map.innerHTML=`<svg viewBox="0 0 400 400" role="group" aria-label="세계관 천체도"><defs><path id="rp" d="M13 200a187 187 0 1 1 374 0a187 187 0 1 1-374 0"/></defs><g class="spin"><circle cx="200" cy="200" r="196" class="hair"/><circle cx="200" cy="200" r="178" class="hair"/><text><textPath href="#rp" textLength="1160" lengthAdjust="spacing">${L.map(([c])=>plain(c.name)).join("  ✦  ")}  ✦</textPath></text></g><circle cx="200" cy="200" r="150" class="tick"/><circle cx="200" cy="200" r="126" class="hair"/><polyline class="ln" pathLength="1" points="${pts.join(" ")}"/>${L.map(([c,j],i)=>{const[x,y]=pts[i];return `<a href="#c${j+1}" data-i="${j+1}" data-n="${plain(c.name)}" aria-label="${j+1}. ${plain(c.name)}"><circle class="hit" cx="${x}" cy="${y}" r="14"/><circle class="rg" cx="${x}" cy="${y}" r="15"/><circle class="halo" cx="${x}" cy="${y}" r="8" fill="${c.color}" fill-opacity=".25"/><circle class="pt" cx="${x}" cy="${y}" r="3.2" fill="#fff"/><text class="nm" x="${x}" y="${y-12}" text-anchor="middle">${j+1}</text></a>`}).join("")}</svg>`;
const setCap=e=>{const a=e.target.closest&&e.target.closest("a");cap.textContent=a?a.dataset.n:CAP0};
map.addEventListener("pointerover",setCap);map.addEventListener("focusin",setCap);map.addEventListener("pointerleave",()=>cap.textContent=CAP0);
map.onclick=e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();show(+a.getAttribute("href").slice(2),1)};

/* 카테고리 제목 옆 미니 별자리: 작품 수만큼 별이 이어집니다 */
const mini=(k,c)=>{k=Math.min(k,8);const p=[...Array(k)].map((_,i)=>[5+i*30/Math.max(k-1,1),i%2?7:17]);return `<svg class="mini" viewBox="0 0 40 24" aria-hidden="true"><polyline points="${p.join(" ")}" fill="none" stroke="${c}" stroke-opacity=".55"/>${p.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="${c}"/>`).join("")}</svg>`};

function imgBox(name,img,tags){
  const im=$("div","img");
  if(img){const i=$("img");i.src=img;i.alt=name;i.loading="lazy";im.appendChild(i)}
  else im.textContent="?";
  if(tags&&tags.length){const b=$("div","badges");tags.forEach(t=>b.appendChild($("span","badge",t)));im.appendChild(b)}
  return im;
}

/* 팝업: 이미지 + 이름, 같은 세계관 안에서 ‹ › 로 넘겨볼 수 있어요. 상세내용·링크는 item[2](링크) 등에 추가 */
let cur=[],pi=0;
const dlg=document.getElementById("dlg"),pop=document.getElementById("pop");
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
function openPop(i){
  pi=(i+cur.length)%cur.length;
  const {item,cat}=cur[pi],[name,,link,img,o={}]=item;
  const x=$("button","close","✕");x.type="button";x.setAttribute("aria-label","닫기");x.onclick=()=>dlg.close();
  const fr=$("div","frame"+(img?"":" empty"));fr.append(imgBox(name,img));
  const info=$("div","info"),cr=$("p","crumb");
  cr.append($("span",null,plain(cat.name)));if(cat.tag&&!cat.soon)cr.append($("span",null,cat.tag));
  info.append(cr,$("h2",null,name));
  if((o.tags&&o.tags.length)||(o.pf&&o.pf.length)){const v=$("div","vers");(o.tags||[]).forEach(t=>v.append($("em",null,t)));sp(o.pf||[]).forEach(n=>v.append(pf(n)));info.append(v)}
  if(!img)info.append($("p","wait","이미지 준비 중이에요"));
  if(link){const a=$("a","go","작품 보러가기");a.href=link;a.target="_blank";a.rel="noopener";info.append(a)}
  const kids=[x,fr,info];
  if(cur.length>1){
    const nav=$("div","pnav"),pv=$("button",null,"‹"),nx=$("button",null,"›");
    pv.type=nx.type="button";pv.setAttribute("aria-label","이전");nx.setAttribute("aria-label","다음");
    pv.onclick=()=>openPop(pi-1);nx.onclick=()=>openPop(pi+1);
    nav.append(pv,$("span",null,(pi+1)+" / "+cur.length),nx);kids.push(nav);
  }
  pop.replaceChildren(...kids);
  dlg.style.setProperty("--c",cat.color);
  if(!dlg.open)dlg.showModal();
}
document.addEventListener("keydown",e=>{if(!dlg.open||cur.length<2)return;if(e.key==="ArrowRight")openPop(pi+1);if(e.key==="ArrowLeft")openPop(pi-1)});

/* NEW — added 날짜가 있는 작품을 최신순으로 자동 수집 */
const fresh=[];
CATS.forEach(cat=>cat.rows.forEach(r=>r.items.forEach(it=>{
  if(it[4]&&it[4].added)fresh.push({it,cat:{...cat,soon:false},from:plain(cat.name)});
})));
fresh.sort((a,b)=>b.it[4].added.localeCompare(a.it[4].added));
const NEW={isNew:true,name:"NEW",color:"#FF6B72",rows:[{items:fresh.slice(0,NEW_MAX)}]};

/* 이름표: 이미지 없이 이름만. 누르면 팝업에서 이미지가 열립니다 */
let sel=0,gen="";const q=document.getElementById("q");
const PFC={WHIF:"wh",Tingle:"tg",Doomchk:"dm",Postype:"po","INK Chat":"ic","티팟":"tp"},pf=n=>$("span","pf "+(PFC[n]||""),n),sp=a=>[...a].sort((x,y)=>[WH,TG,DM,PO,IC,TP].indexOf(x)-[WH,TG,DM,PO,IC,TP].indexOf(y));
function tag(e,i){
  const [name,desc,,img,o={}]=e.item;
  const b=$("button","nt");b.type="button";b.style.setProperty("--c",e.cat.color);
  const th=$("span","th");
  if(img){const m=$("img");m.src=img;m.alt="";m.loading="lazy";m.decoding="async";th.append(m)}else th.textContent=name.trim()[0];
  const top=$("span","top");top.append(th,$("b",null,name));
  const meta=$("span","meta");
  (o.tags||[]).forEach(t=>meta.append($("em",null,t)));
  sp(o.pf||[]).forEach(n=>meta.append(pf(n)));
  if(e.from||desc)meta.append($("small",null,e.from||desc));
  b.append(top,meta);
  if(!e.cat.soon)b.onclick=()=>openPop(i);
  return b;
}
const ALL=[NEW,...CATS],side=document.getElementById("side"),panel=document.getElementById("panel"),layout=document.getElementById("layout");
ALL.forEach((cat,i)=>{
  const b=$("button");b.type="button";b.style.setProperty("--c",cat.color);
  b.insertAdjacentHTML("afterbegin",mini(cat.rows.reduce((a,r)=>a+r.items.length,0),cat.color));
  const t=$("span","t");t.append($("b",null,cat.isNew?"NEW":cat.soon?"곧 공개됩니다":cat.name),$("small",null,cat.isNew?"최근 추가순":cat.tag&&!cat.soon?"["+cat.tag+"]":""));
  b.append($("span","num",cat.isNew?"★":cat.soon?"…":i+"."),t);
  b.onclick=()=>show(i);side.appendChild(b);
});
function show(i,go){
  const cat=ALL[i];sel=i;q.value="";
  map.querySelectorAll("a").forEach(a=>{const on=+a.dataset.i===i;a.classList.toggle("on",on);on?a.setAttribute("aria-current","true"):a.removeAttribute("aria-current")});
  map.classList.toggle("sel",i>=1&&!cat.soon);
  CAP0=cat.isNew?"최근 추가된 작품":cat.soon?"곧 공개될 세계관":plain(cat.name);cap.textContent=CAP0;
  [...side.children].forEach((b,k)=>b.classList.toggle("on",k===i));
  panel.style.setProperty("--c",cat.color);panel.className="panel"+(cat.soon?" soon":"");
  const h=$("h2");h.append($("span","num",cat.isNew?"NEW":cat.soon?"SOON":i+"."),$("span",null,cat.isNew?"최근 추가순":cat.name));
  if(cat.tag&&!cat.soon)h.append($("small",null,"["+cat.tag+"]"));
  cur=cat.rows.flatMap(r=>r.items.map(it=>cat.isNew?{item:it.it,cat:it.cat,from:it.from}:{item:it,cat}));let k=0;const kids=[h];
  cat.rows.forEach(r=>{
    const row=$("div","row");
    if(r.t||r.note){const rh=$("div","rowhead");if(r.t)rh.append($("h3",null,r.t));if(r.note)rh.append($("span","note",r.note));row.append(rh)}
    const w=$("div","tags");r.items.forEach(()=>{w.append(tag(cur[k],k));k++});
    row.append(w);kids.push(row);
  });
  panel.replaceChildren(...kids);
  if(go)layout.scrollIntoView({behavior:"smooth",block:"start"});
}
/* 장르 필터(왼쪽 목록을 거름) + 이름 검색(모든 세계관에서 찾음) */
const chipBox=document.getElementById("chips");
["전체",...new Set(CATS.filter(c=>c.tag&&!c.soon).map(c=>c.tag))].forEach(g=>{
  const b=$("button",g==="전체"?"on":"",g);b.type="button";
  b.onclick=()=>{
    gen=g==="전체"?"":g;
    [...chipBox.children].forEach(x=>x.classList.toggle("on",x===b));
    [...side.children].forEach((x,k)=>{const c=ALL[k];x.hidden=!!gen&&!(c.tag===gen&&!c.soon)});
    if(gen&&(ALL[sel].tag!==gen||ALL[sel].soon))show(ALL.findIndex(c=>!c.soon&&c.tag===gen));
  };
  chipBox.append(b);
});
const norm=t=>t.toLowerCase().replace(/\s/g,"");
q.addEventListener("input",()=>{
  const nq=norm(q.value);
  if(!nq){show(sel);return}
  const hits=[];
  CATS.forEach(c=>{if(c.soon)return;const cn=norm(plain(c.name));c.rows.forEach(r=>r.items.forEach(it=>{if(cn.includes(nq)||norm(it[0]).includes(nq)||(it[4].pf||[]).some(n=>norm(n).includes(nq)))hits.push({item:it,cat:c,from:plain(c.name)})}))});
  cur=hits;
  [...side.children].forEach(b=>b.classList.remove("on"));
  map.classList.remove("sel");map.querySelectorAll("a").forEach(a=>a.classList.remove("on"));
  panel.style.setProperty("--c","#E9CF8C");panel.className="panel";
  const h=$("h2");h.append($("span",null,"검색 결과"),$("small",null,hits.length+"개"));
  const kids=[h];
  if(!hits.length)kids.push($("p","none","일치하는 이름이 없어요."));
  else{const w=$("div","tags");hits.forEach((e,k)=>w.append(tag(e,k)));kids.push(w)}
  panel.replaceChildren(...kids);
});
const h0=+location.hash.slice(2);show(h0>=0&&h0<ALL.length?h0:0);
</script>
