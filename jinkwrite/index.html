<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jin_K · 제작자 소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@property --tint{syntax:"<color>";inherits:true;initial-value:#14224d}
:root{--f:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;color-scheme:dark;--bg:#060A18;--ink:#E8EBF5;--muted:#AAB3CF;--gold:#E9CF8C;--line:rgba(255,255,255,.1);--ph:rgba(255,255,255,.05);--gs:"Gungsuh","GungsuhChe","궁서","궁서체","Noto Serif KR",serif}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(70vmax 60vmax at 78% 6%,#14224d 0,transparent 62%),var(--bg);color:var(--ink);font:400 16px/1.7 var(--f);padding:0 20px 80px;overflow-x:hidden;word-break:keep-all;--tint:#14224d;transition:--tint .7s ease}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.8;background:radial-gradient(1.5px 1.5px at 30px 40px,#fff,transparent),radial-gradient(1px 1px at 120px 90px,#cfe3ff,transparent),radial-gradient(1.5px 1.5px at 200px 170px,#fff,transparent),radial-gradient(1px 1px at 80px 210px,#fff,transparent);background-size:240px 240px}
/* 선택한 세계관 색이 배경 모서리에 은은하게 번져요 */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 50vmax at 6% 100%,color-mix(in srgb,var(--tint) 20%,transparent),transparent 70%)}
.wrap{max-width:1200px;margin:0 auto}
header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:40px;align-items:center;padding:72px 0 40px}
h1{font:800 clamp(52px,9vw,96px)/1 var(--f);letter-spacing:-.03em}
.sub{margin-top:14px;color:var(--gold)}
.ticker{display:inline-flex;align-items:center;gap:10px;margin-top:18px;max-width:100%;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:500 13px var(--f);text-align:left;transition:border-color .2s}
.ticker[hidden]{display:none}
.ticker b{flex:none;font:800 11px/1 var(--f);padding:5px 8px;border-radius:999px;background:#FF6B72;color:#fff}
.ticker span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ticker:hover{border-color:var(--gold)}
.notice{margin-top:30px;border-left:1px solid var(--gold);padding:2px 0 2px 20px;max-width:520px}
.notice h2{font:500 13px var(--f);color:var(--muted);margin-bottom:8px}
.notice p{margin-bottom:12px;font-size:14px}
.notice p:last-child{margin-bottom:0}
.notice a{color:var(--gold);text-underline-offset:3px}
.notice .lab{display:block;color:var(--muted);font-size:13px}
.notice .gs{font-size:17px;font-weight:600;line-height:1.7}
.adult{display:inline-block;margin-left:6px;padding:1px 7px;border:1px solid #FF6B72;color:#FF8A90;border-radius:999px;font:700 11px/1.6 var(--f);vertical-align:middle}
.btn{display:inline-block;margin-top:22px;padding:10px 24px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-weight:500;transition:background .2s,color .2s}
.btn:hover{background:var(--gold);color:var(--bg)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.map svg{width:100%;height:auto;display:block;overflow:visible}
.cap{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--muted);font-size:13px;margin-top:8px;min-height:26px}
.cap img{width:24px;height:24px;flex:none;border-radius:50%;object-fit:cover;object-position:50% 18%;border:1px solid var(--gold)}
.hair{fill:none;stroke:var(--gold);stroke-opacity:.22}
.tick{fill:none;stroke:var(--gold);stroke-opacity:.35;stroke-width:6;stroke-dasharray:1.2 8.8}
.spin{transform-origin:200px 200px;animation:spin 150s linear infinite}
.map:hover .spin{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.ln{fill:none;stroke:var(--gold);stroke-opacity:.55;stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.map text{fill:var(--muted);font:500 10px var(--f);letter-spacing:.04em}
.map .nm{fill:var(--gold);font-size:9px;letter-spacing:0}
.hit{fill:transparent}
.map a{cursor:pointer}
.map a:focus-visible{outline:none}
.map a:focus-visible .hit,.map a:hover .hit{stroke:var(--gold);stroke-opacity:.6}
.mini{width:40px;height:24px;flex:none}
.img{position:relative;aspect-ratio:3/4;background:var(--ph);display:grid;place-items:center;font:800 44px var(--f);color:var(--c)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
footer{margin-top:56px;color:var(--muted);font-size:13px}
@media(max-width:820px){header{grid-template-columns:1fr;gap:28px;padding-top:48px}.map{max-width:380px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ln{stroke-dashoffset:0}}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start;scroll-margin-top:16px}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding-right:4px}
.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink);font:600 14px/1.35 var(--f);cursor:pointer;transition:background .2s}
.side button:hover{background:rgba(255,255,255,.05)}
.side button.on{background:rgba(255,255,255,.07);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.side .mini{width:34px;height:20px;flex:none}
.side .num{color:var(--gold);min-width:22px;font-size:13px}
.side .t{display:flex;flex-direction:column;min-width:0}
.side small{color:var(--muted);font:400 13px var(--f)}
.panel{background:rgba(255,255,255,.035);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:16px;padding:22px 22px 28px;min-height:260px}
.panel h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;font:800 clamp(22px,3.4vw,30px)/1.3 var(--f);margin-bottom:18px}
.panel h2 .num{color:var(--gold)}
.panel h2 small{font:500 13px var(--f);color:var(--muted)}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.phead h2{margin-bottom:0}
.vt{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;padding:2px}
.vt button{font:600 12.5px var(--f);padding:5px 12px;border-radius:999px;border:0;background:transparent;color:var(--muted)}
.vt button:hover{color:var(--ink)}
.vt button.on{background:rgba(233,207,140,.16);color:var(--gold)}
.row+.row{margin-top:22px}
.rowhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px}
.rowhead h3{font:700 17px var(--f)}
.rowhead .note{color:var(--muted);font-size:13px}
.panel.soon .nt{border-style:dashed;cursor:default}
.panel.soon .nt:hover{transform:none;background:rgba(255,255,255,.04);border-color:var(--line)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static;flex-direction:row;max-height:none;overflow-x:auto;padding:0 0 8px}.side button{width:auto;flex:none;white-space:nowrap}.side .mini{display:none}}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.nt{display:grid;grid-template-rows:1fr auto;gap:6px;height:116px;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);border-left:3px solid var(--c);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.nt:hover{transform:translateY(-2px);border-color:var(--gold);border-left-color:var(--c);background:rgba(255,255,255,.08)}
.nt .top{display:flex;align-items:center;gap:10px;min-width:0}
.hole{width:8px;height:8px;margin-top:8px;border-radius:50%;border:1px solid var(--c);flex:none}
.nt b{font:700 15px/1.4 var(--f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nt .meta{display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;gap:4px;height:46px;overflow:hidden;min-width:0}
.nt em{flex:none;font:600 11px/1 var(--f);font-style:normal;padding:4px 7px;border-radius:999px;border:1px solid rgba(233,207,140,.5);color:var(--gold)}
.nt small{font:400 13px var(--f);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* 갤러리(격자) 카드 */
.tags.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gc{position:relative;display:block;width:100%;padding:0;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:var(--ph);color:var(--ink);font:inherit;text-align:left;transition:transform .25s,border-color .25s,box-shadow .25s}
.gc:hover,.gc:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 30px -12px color-mix(in srgb,var(--c) 70%,#000)}
.gi{position:absolute;inset:0;display:grid;place-items:center;font:800 44px var(--f);color:var(--c)}
.gi img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;transition:transform .5s ease}
.gc:hover .gi img{transform:scale(1.05)}
.gcap{position:absolute;left:0;right:0;bottom:0;padding:38px 10px 10px;background:linear-gradient(to top,rgba(4,6,16,.94),rgba(4,6,16,.6) 58%,transparent);display:flex;flex-direction:column;gap:3px;min-width:0}
.gcap b{font:700 14px/1.3 var(--f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcap small{font:400 12px/1.4 var(--f);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gpf{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.gpf .pf{font-size:10px;padding:3px 6px}
.pf.more{background:rgba(255,255,255,.16);color:#fff}
.nw{position:absolute;top:8px;left:8px;z-index:2;font:800 10px/1 var(--f);padding:4px 7px;border-radius:999px;background:#FF6B72;color:#fff}
@media(max-width:520px){.tags{grid-template-columns:minmax(0,1fr)}.tags.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
dialog{border:1px solid var(--line);border-radius:22px;padding:0;background:rgba(14,20,44,.78);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);color:var(--ink);width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;margin:auto;box-shadow:0 24px 80px -12px color-mix(in srgb,var(--c,#7B5CFF) 45%,#000)}
dialog[open]{animation:pin .25s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(12px)}}
dialog::backdrop{background:rgba(4,6,16,.72);backdrop-filter:blur(4px)}
.pop{position:relative;touch-action:pan-y}
.frame{margin:14px 14px 0;padding:6px;border:1px solid rgba(233,207,140,.35);border-radius:18px;position:relative}
.frame .img{border-radius:13px;overflow:hidden;font-size:88px;max-height:min(62vh,520px);position:relative}
.frame .img.contain{aspect-ratio:auto;min-height:200px;background:rgba(0,0,0,.35)}
.frame .img.contain img{height:auto;max-height:min(62vh,520px);object-fit:contain}
.asset-btn,.fit-btn{
  position:absolute;bottom:18px;z-index:3;
  padding:8px 16px;border-radius:999px;
  background:rgba(6,10,24,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid #fff;color:#fff;font:600 13px var(--f);
  text-decoration:none;white-space:nowrap;transition:background .2s,color .2s;
}
.asset-btn{right:18px}
.fit-btn{left:18px}
.asset-btn:hover,.fit-btn:hover{background:#fff;color:var(--bg)}
.frame.empty .img{background:transparent;border:1px dashed var(--line)}
.info{padding:18px 22px 22px}
.info:has(+.pnav){padding-bottom:6px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--gold);font:600 13px var(--f)}
.crumb span+span{color:var(--muted);font-weight:400}
.crumb span+span::before{content:"";display:inline-block;width:3px;height:3px;margin-right:8px;border-radius:50%;background:var(--muted);vertical-align:middle}
.info h2{margin-top:6px;font:800 26px/1.3 var(--f);letter-spacing:-.01em}
.ds{margin-top:8px;font-size:14px;line-height:1.6;color:var(--ink);opacity:.88}
.vers{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.vers em{font:600 12px/1 var(--f);font-style:normal;padding:5px 9px;border-radius:999px;border:1px solid rgba(233,207,140,.5);color:var(--gold)}
.wait{margin-top:8px;color:var(--muted);font-size:13px}
.go{display:inline-block;margin-top:14px;padding:9px 20px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-weight:600}
.go:hover{background:var(--gold);color:var(--bg)}
.pnav{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 22px 18px;color:var(--muted);font-size:13px}
.pnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:16px}
.pnav button:hover{border-color:var(--gold)}
.close{position:absolute;top:24px;right:24px;z-index:2;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(6,10,24,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:17px;cursor:pointer}
.lc{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 32px);min-height:0}
.side{position:static;max-height:none;flex:1;min-height:0}
.side button[hidden]{display:none}
.lc input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:500 14px var(--f)}
.lc input::placeholder{color:var(--muted)}
.lc input:focus-visible{outline:none;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.chips button{flex:none;white-space:nowrap;user-select:none;-webkit-user-select:none;font:600 12.5px var(--f);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chips button:hover{border-color:var(--gold)}
.chips button.on{border-color:var(--gold);color:var(--gold)}
.none{color:var(--muted)}
/* 계층 세계관 블록 (접기/펼치기) */
.world-block{margin-bottom:18px;border:1px solid color-mix(in srgb,var(--c,#E9CF8C) 35%,var(--line));border-radius:14px;background:rgba(255,255,255,.025);overflow:hidden}
.world-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;background:rgba(255,255,255,.04);border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
.world-head:hover{background:rgba(255,255,255,.07)}
.world-head .arr{margin-left:auto;font-size:14px;color:var(--gold);transition:transform .25s}
.world-block.open .world-head{border-bottom-color:var(--line)}
.world-block.open .arr{transform:rotate(90deg)}
.world-head b{font:700 16px var(--f)}
.world-head small{color:var(--muted);font:400 13px var(--f)}
.world-content{padding:14px 14px 18px;display:none}
.world-block.open .world-content{display:block}
.world-content .tags{margin-top:4px}
.th{width:38px;height:38px;flex:none;border-radius:50%;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 70%,transparent);background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--c);font:700 15px var(--f)}
.th img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.map a{transition:opacity .3s}
.map .halo,.map .pt{transform-box:fill-box;transform-origin:center;transition:transform .35s,fill-opacity .35s}
.map .rg{fill:none;stroke:var(--gold);stroke-opacity:0;transition:stroke-opacity .35s}
.map a.on .halo{transform:scale(2.3);fill-opacity:.55}
.map a.on .pt{transform:scale(1.6)}
.map a.on .rg{stroke-opacity:.9}
.map a.on .nm{font-size:11px;font-weight:700}
.map.sel a:not(.on){opacity:.5}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.lc{position:static;max-height:none;min-width:0}.side{flex:none}}
.pf{display:inline-flex;align-items:center;flex:none;font:700 11px/1 var(--f);padding:4px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pf.wh{background:#7B52E6;color:#fff}
.pf.tg{background:#E9468A;color:#fff}
.pf.dm{background:#FF9CC4;color:#111}
.pf.po{background:#111;color:#fff;border-color:rgba(255,255,255,.35)}
.pf.tp{background:#20A98F;color:#fff}
.pf.ic{background:#111;color:#FF9A3D;border-color:rgba(255,154,61,.5)}
.pf.tk{background:#5B2AB5;color:#fff;border-color:rgba(255,255,255,.35)}
.pf.lp{background:#FFD700;color:#fff;border-color:#FFD700}
.pf.cd{background:#FFE566;color:#FF6B00;border-color:#FF8C00}
.vers .pf{font-size:12.5px;padding:6px 11px}
.verpill:hover{background:rgba(233,207,140,.16)}
/* 이미지 로딩 중 스켈레톤 */
.ld{background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.04) 70%) 0 0/200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
html{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2732%27%20height%3D%2732%27%20viewBox%3D%270%200%2032%2032%27%3E%3Cpolygon%20points%3D%2716.0%2C4.0%2019.1%2C11.8%2027.4%2C12.3%2020.9%2C17.6%2023.1%2C25.7%2016.0%2C21.2%208.9%2C25.7%2011.1%2C17.6%204.6%2C12.3%2012.9%2C11.8%27%20fill%3D%27%23E9CF8C%27%20stroke%3D%27%23060A18%27%20stroke-width%3D%271.6%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E") 16 16,auto}
a,button,summary,select,[role=button],.nt,.map a,.chips button{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2740%27%20height%3D%2740%27%20viewBox%3D%270%200%2040%2040%27%3E%3Ccircle%20cx%3D%2720.0%27%20cy%3D%2720.0%27%20r%3D%2719%27%20fill%3D%27%23FFFFFF%27%20fill-opacity%3D%27.18%27%2F%3E%3Cpolygon%20points%3D%2720.0%2C5.0%2023.8%2C14.7%2034.3%2C15.4%2026.2%2C22.0%2028.8%2C32.1%2020.0%2C26.5%2011.2%2C32.1%2013.8%2C22.0%205.7%2C15.4%2016.2%2C14.7%27%20fill%3D%27%23FFFFFF%27%20stroke%3D%27%23E9CF8C%27%20stroke-width%3D%271.6%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E") 20 20,pointer}
input[type=search]{cursor:text}
.panel.soon .nt{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2732%27%20height%3D%2732%27%20viewBox%3D%270%200%2032%2032%27%3E%3Cpolygon%20points%3D%2716.0%2C4.0%2019.1%2C11.8%2027.4%2C12.3%2020.9%2C17.6%2023.1%2C25.7%2016.0%2C21.2%208.9%2C25.7%2011.1%2C17.6%204.6%2C12.3%2012.9%2C11.8%27%20fill%3D%27%23E9CF8C%27%20stroke%3D%27%23060A18%27%20stroke-width%3D%271.6%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E") 16 16,default}
#dust{position:fixed;inset:0;width:100vw;height:100vh;margin:0;padding:0;border:0;background:transparent;overflow:visible;pointer-events:none;z-index:9999}
</style>
</head>
<body>
<div class="wrap">
<header>

  if(isHapjak) numText = ""; // 합작은 번호 없음
  b.append($("span","num",numText),t);
  b.onclick=()=>show(i);side.appendChild(b);
});
/* 플랫폼 필터 칩 */
const pBox=document.getElementById("pchips");
const syncP=()=>[...pBox.children].forEach((b,k)=>b.classList.toggle("on",k===0?!plat:b.textContent===plat));
["전체 플랫폼",...PFL].forEach(p=>{
  const b=$("button","",p);b.type="button";
  b.onclick=()=>{plat=p==="전체 플랫폼"?"":p;syncP();results()};
  pBox.append(b);
});
function show(i,go){
  const cat=ALL[i];sel=i;q.value="";plat="";syncP();
  document.body.style.setProperty("--tint",cat.color);
  map.querySelectorAll("a").forEach(a=>{const on=+a.dataset.i===i;a.classList.toggle("on",on);on?a.setAttribute("aria-current","true"):a.removeAttribute("aria-current")});
  map.classList.toggle("sel",i>=1&&!cat.soon);
  CAP0=cat.isNew?"최근 추가된 작품":cat.soon?"곧 공개될 세계관":plain(cat.name);capSet(CAP0);
  [...side.children].forEach((b,k)=>b.classList.toggle("on",k===i));
  panel.style.setProperty("--c",cat.color);panel.className="panel"+(cat.soon?" soon":"");
  const h=$("h2");
  const isHapjak = cat.name === "합작";
  h.append($("span","num",cat.isNew?"NEW":cat.soon?"SOON":isHapjak?"":i+"."),$("span",null,cat.isNew?"최근 추가순":isHapjak?"합작":cat.name));
  if(cat.tag&&!cat.soon)h.append($("small",null,"["+cat.tag+"]"));
  const ph=$("div","phead");ph.append(h);if(!cat.soon)ph.append(vt());
  const kids=[ph];
  if(cat.worldLink){
    const wl=$("a","btn","세계관 설명");
    wl.href=cat.worldLink;wl.target="_blank";wl.rel="noopener";
    wl.style.display="inline-block";wl.style.margin="0 0 18px";
    kids.push(wl);
  }
  const g=view==="grid"&&!cat.soon;
  cur=cat.rows.flatMap(r=>r.items.map(it=>cat.isNew?{item:it.it,cat:it.cat,from:it.from}:{item:it,cat}));let k=0;
  cat.rows.forEach(r=>{
    const row=$("div","row");
    if(r.t||r.note){const rh=$("div","rowhead");if(r.t)rh.append($("h3",null,r.t));if(r.note)rh.append($("span","note",r.note));row.append(rh)}
    const w=$("div","tags"+(g?" grid":""));r.items.forEach(()=>{w.append(g?gcard(cur[k],k):tag(cur[k],k));k++});
    row.append(w);kids.push(row);
  });
  panel.replaceChildren(...kids);
  if(go)layout.scrollIntoView({behavior:"smooth",block:"start"});
}
/* 장르 필터 */
const chipBox=document.getElementById("chips");
["전체",...new Set(CATS.filter(c=>c.tag&&!c.soon).map(c=>c.tag))].forEach(g=>{
  const b=$("button",g==="전체"?"on":"",g);b.type="button";
  b.onclick=()=>{
    gen=g==="전체"?"":g;
    [...chipBox.children].forEach(x=>x.classList.toggle("on",x===b));
    [...side.children].forEach((x,k)=>{const c=ALL[k];x.hidden=!!gen&&!(c.tag===gen&&!c.soon)});
    if(!gen){show(sel);return}
    showGrouped(CATS.filter(c=>c.tag===gen&&!c.soon), g+" 세계관");
  };
  chipBox.append(b);
});
/* 계층 그룹 렌더 (장르/플랫폼용) */
function showGrouped(cats, title){
  q.value="";plat="";syncP();
  [...side.children].forEach(b=>b.classList.remove("on"));
  map.classList.remove("sel");map.querySelectorAll("a").forEach(a=>a.classList.remove("on"));
  document.body.style.setProperty("--tint","#E9CF8C");
  panel.style.setProperty("--c","#E9CF8C");panel.className="panel";
  const h=$("h2");h.append($("span",null,title),$("small",null,cats.length+"개 세계관"));
  const ph=$("div","phead");ph.append(h,vt());
  const kids=[ph];
  cur=[];
  let gIdx=0;
  if(!cats.length){kids.push($("p","none","해당 세계관이 없어요."));}
  else{
    cats.forEach(cat=>{
      const block=$("div","world-block open");block.style.setProperty("--c",cat.color);
      const head=$("div","world-head");
      head.append($("b",null,plain(cat.name)),$("small",null,countOf(cat)+"작품"),$("span","arr","›"));
      head.onclick=()=>block.classList.toggle("open");
      const content=$("div","world-content");
      const g=view==="grid",w=$("div","tags"+(g?" grid":""));
      const items=cat.rows.flatMap(r=>r.items.map(it=>({item:it,cat})));
      items.forEach((e)=>{
        w.append(g?gcard(e,gIdx):tag(e,gIdx));
        gIdx++;
      });
      cur.push(...items);
      content.append(w);
      block.append(head,content);
      kids.push(block);
    });
  }
  panel.replaceChildren(...kids);
  layout.scrollIntoView({behavior:"smooth",block:"start"});
}
/* 검색 + 플랫폼 필터 결과 */
const norm=t=>t.toLowerCase().replace(/\s/g,"");
function results(keep){
  const nq=norm(q.value);
  if(!nq&&!plat){
    if(gen) showGrouped(CATS.filter(c=>c.tag===gen&&!c.soon), gen+" 세계관");
    else show(sel);
    return;
  }
  const byCat=new Map();
  CATS.forEach(c=>{
    if(c.soon)return;
    const cn=norm(plain(c.name));
    const items=[];
    c.rows.forEach(r=>r.items.forEach(it=>{
      const pl=it[4].pf||[];
      if(plat&&!pl.includes(plat))return;
      if(!nq||cn.includes(nq)||norm(it[0]).includes(nq)||pl.some(n=>norm(n).includes(nq)))items.push({item:it,cat:c,from:plain(c.name)});
    }));
    if(items.length)byCat.set(c,items);
  });
  [...side.children].forEach(b=>b.classList.remove("on"));
  map.classList.remove("sel");map.querySelectorAll("a").forEach(a=>a.classList.remove("on"));
  document.body.style.setProperty("--tint","#E9CF8C");
  panel.style.setProperty("--c","#E9CF8C");panel.className="panel";
  const total=Array.from(byCat.values()).reduce((a,b)=>a+b.length,0);
  const h=$("h2");h.append($("span",null,plat&&!nq?plat+" 작품":"검색 결과"),$("small",null,total+"개"));
  const ph=$("div","phead");ph.append(h,vt());
  const kids=[ph];
  cur=[];
  let gIdx=0;
  if(!total)kids.push($("p","none","일치하는 작품이 없어요."));
  else{
    byCat.forEach((items,cat)=>{
      const block=$("div","world-block open");block.style.setProperty("--c",cat.color);
      const head=$("div","world-head");
      head.append($("b",null,plain(cat.name)),$("small",null,items.length+"작품"),$("span","arr","›"));
      head.onclick=()=>block.classList.toggle("open");
      const content=$("div","world-content");
      const g=view==="grid",w=$("div","tags"+(g?" grid":""));
      items.forEach((e)=>{
        w.append(g?gcard(e,gIdx):tag(e,gIdx));
        gIdx++;
      });
      content.append(w);
      block.append(head,content);
      kids.push(block);
      cur.push(...items);
    });
  }
  panel.replaceChildren(...kids);
}
q.addEventListener("input",()=>results());
const mh=location.hash.match(/^#c(\d+)(?:-(\d+))?$/);
const h0=mh?+mh[1]:0;
show(h0>=0&&h0<ALL.length?h0:0);
/* 커서 별가루 */
let dustUp=()=>{};
(()=>{
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cv=document.getElementById("dust"),cx=cv.getContext("2d"),ps=[],COL=["#FFF4C9","#E9CF8C","#FFFFFF","#BFD9FF","#FFD6EC"];
  let W,H,raf=0,lx=-1,ly=-1,lt=0;
  const fit=()=>{const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)};
  fit();addEventListener("resize",fit);
  dustUp=()=>{try{if(cv.hidePopover){cv.hidePopover();cv.showPopover()}}catch(e){}};
  try{cv.showPopover&&cv.showPopover()}catch(e){}
  const add=(x,y,boost)=>{
    const a=Math.random()*6.283,v=boost?Math.random()*2.2+.6:Math.random()*.5;
    ps.push({x:x+(Math.random()-.5)*8,y:y+(Math.random()-.5)*8,vx:Math.cos(a)*v,vy:Math.sin(a)*v+.25,life:0,max:600+Math.random()*600,s:1.6+Math.random()*3.4,c:COL[Math.random()*COL.length|0],k:Math.random()<.55,r:Math.random()*6.28,w:(Math.random()-.5)*.05,ph:Math.random()*6});
    if(ps.length>140)ps.shift();
  };
  const go=()=>{if(!raf)raf=requestAnimationFrame(tick)};
  function tick(t){
    const dt=Math.min(t-(lt||t),40);lt=t;
    cx.clearRect(0,0,W,H);
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];p.life+=dt;
      if(p.life>=p.max){ps.splice(i,1);continue}
      const f=dt/16;p.x+=p.vx*f;p.y+=p.vy*f;p.vx*=.985;p.vy+=.004*f;p.r+=p.w*f;
      const a=(1-p.life/p.max)*(.65+.35*Math.sin(p.life*.02+p.ph));
      cx.globalAlpha=Math.max(a,0);cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=6;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.beginPath();
      if(p.k){const R=p.s*1.7,q=R*.26;cx.moveTo(0,-R);cx.lineTo(q,-q);cx.lineTo(R,0);cx.lineTo(q,q);cx.lineTo(0,R);cx.lineTo(-q,q);cx.lineTo(-R,0);cx.lineTo(-q,-q);cx.closePath()}
      else cx.arc(0,0,p.s*.45,0,6.283);
      cx.fill();cx.restore();
    }
    if(ps.length)raf=requestAnimationFrame(tick);else{raf=0;lt=0;cx.clearRect(0,0,W,H)}
  }
  addEventListener("pointermove",e=>{
    if(e.pointerType!=="mouse")return;
    if(lx<0){lx=e.clientX;ly=e.clientY}
    const d=Math.hypot(e.clientX-lx,e.clientY-ly);
    if(d>=10){for(let i=0;i<Math.min(3,Math.ceil(d/18));i++)add(e.clientX,e.clientY);lx=e.clientX;ly=e.clientY;go()}
  },{passive:true});
  addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;for(let i=0;i<12;i++)add(e.clientX,e.clientY,1);go()},{passive:true});
})();
</script>
